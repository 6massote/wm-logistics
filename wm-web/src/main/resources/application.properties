spring.application.name=wm-logistics

# Keeps the URLs of the old Wildfly deployment (http://localhost:8080/wm-logistics/...)
server.servlet.context-path=/wm-logistics

# Neo4j over Bolt. Override with SPRING_NEO4J_URI / SPRING_NEO4J_AUTHENTICATION_USERNAME /
# SPRING_NEO4J_AUTHENTICATION_PASSWORD (no password is hardcoded on purpose).
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j

# POST /core/database/reset/neo4j wipes the whole graph. Only enable it for dev and tests.
wm.database-reset.enabled=false
